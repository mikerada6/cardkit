# Test-only SLF4J (slf4j-simple) configuration.
#
# The library binds no logging provider in production; tests bind slf4j-simple
# so the SLF4J API resolves to a real backend instead of the NOP logger. This
# file enables DEBUG for the Require precondition helper so its rejection-path
# log line is observable by RequireTest; everything else stays at the default
# level to keep test output quiet.
#
# Output is sunk to a file (slf4j-simple owns that stream internally) so
# RequireTest can read it back with java.nio.file.Files — the test code itself
# never touches System.out/err or java.io.PrintStream, keeping it clean under
# the LoggingConventionTest ArchUnit guard.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.rezatron.cardkit.core.util.Require=debug
org.slf4j.simpleLogger.logFile=target/require-test.log
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showDateTime=false
